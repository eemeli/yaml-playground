name: Update Pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

on:
  - workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v6
      - uses: actions/checkout@v6
        with:
          repository: eemeli/yaml
          path: yaml
      - uses: actions/checkout@v6
        with:
          repository: eemeli/yaml-playground
          path: playground

      - name: yaml setup
        run: npm ci
        working-directory: ./yaml
      - name: yaml build
        run: npm run build
        working-directory: ./yaml
      - run: npm install
        working-directory: ./playground
      - run: npm run build
        working-directory: ./playground

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/site/
      - uses: actions/deploy-pages@v4
        id: deployment
